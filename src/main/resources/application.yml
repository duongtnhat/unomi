spring:
  application:
    name: unomi
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/unomi}
    username: ${SPRING_DATASOURCE_USERNAME:unomi}
    password: ${SPRING_DATASOURCE_PASSWORD:unomi}
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.unomi.customer.upsert,com.unomi.customer.upsert.messaging,com.unomi.action.messaging
        spring.json.value.default.type: com.unomi.customer.upsert.messaging.UpsertCustomerCommand
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  health:
    elasticsearch:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

unomi:
  kafka:
    outbox:
      publisher:
        enabled: ${UNOMI_OUTBOX_PUBLISHER_ENABLED:true}
        fixed-delay-ms: ${UNOMI_OUTBOX_PUBLISHER_FIXED_DELAY_MS:1000}
    consumers:
      write-es:
        enabled: ${UNOMI_WRITE_ES_CONSUMER_ENABLED:true}
      merge:
        enabled: ${UNOMI_MERGE_CONSUMER_ENABLED:true}
      segment:
        enabled: ${UNOMI_SEGMENT_CONSUMER_ENABLED:true}
      rule:
        enabled: ${UNOMI_RULE_CONSUMER_ENABLED:true}
      action:
        enabled: ${UNOMI_ACTION_CONSUMER_ENABLED:true}
    topics:
      customer-upsert: ${UNOMI_KAFKA_CUSTOMER_UPSERT_TOPIC:customer-upsert-commands}
      profile-merge: ${UNOMI_KAFKA_PROFILE_MERGE_TOPIC:profile-merge-commands}
      segment-qualification: ${UNOMI_KAFKA_SEGMENT_QUALIFICATION_TOPIC:segment-qualification-commands}
      rule-evaluation: ${UNOMI_KAFKA_RULE_EVALUATION_TOPIC:rule-evaluation-commands}
      action-execution: ${UNOMI_KAFKA_ACTION_EXECUTION_TOPIC:action-execution-commands}
