x-unomi-base-env: &unomi-base-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/unomi
  SPRING_DATASOURCE_USERNAME: unomi
  SPRING_DATASOURCE_PASSWORD: unomi
  SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_BOOT_ADMIN_CLIENT_ENABLED: "true"
  SPRING_BOOT_ADMIN_CLIENT_URL: http://spring-boot-admin:9090
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,loggers,env,threaddump
  UNOMI_KAFKA_WEBHOOK_PROCESSING_TOPIC: action-processing-webhook
  UNOMI_KAFKA_EMAIL_PROCESSING_TOPIC: action-processing-email

x-unomi-consumers-off: &unomi-consumers-off
  UNOMI_WRITE_ES_CONSUMER_ENABLED: "false"
  UNOMI_MERGE_CONSUMER_ENABLED: "false"
  UNOMI_SEGMENT_CONSUMER_ENABLED: "false"
  UNOMI_RULE_CONSUMER_ENABLED: "false"
  UNOMI_ACTION_CONSUMER_ENABLED: "false"
  UNOMI_WEBHOOK_CONSUMER_ENABLED: "false"
  UNOMI_EMAIL_CONSUMER_ENABLED: "false"

x-unomi-service: &unomi-service
  image: unomi-modern:latest
  depends_on:
    postgres:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
    spring-boot-admin:
      condition: service_healthy
  restart: unless-stopped

x-unomi-worker: &unomi-worker
  <<: *unomi-service
  depends_on:
    api:
      condition: service_healthy
    spring-boot-admin:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

services:
  spring-boot-admin:
    build:
      context: ..
      dockerfile: deployment/spring-boot-admin/Dockerfile
    image: unomi-spring-boot-admin:latest
    environment:
      SERVER_PORT: 9090
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    <<: *unomi-service
    environment:
      <<: [*unomi-base-env, *unomi-consumers-off]
      SPRING_APPLICATION_NAME: unomi-api
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_NAME: unomi-api
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_URL: http://api:8080
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL: http://api:8080/actuator
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL: http://api:8080/actuator/health
      UNOMI_OUTBOX_PUBLISHER_ENABLED: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  worker-write-es:
    <<: *unomi-worker
    environment:
      <<: [*unomi-base-env, *unomi-consumers-off]
      SPRING_APPLICATION_NAME: unomi-worker-write-es
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_NAME: unomi-worker-write-es
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_URL: http://worker-write-es:8080
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL: http://worker-write-es:8080/actuator
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL: http://worker-write-es:8080/actuator/health
      SPRING_FLYWAY_ENABLED: "false"
      UNOMI_OUTBOX_PUBLISHER_ENABLED: "false"
      UNOMI_WRITE_ES_CONSUMER_ENABLED: "true"

  worker-merge:
    <<: *unomi-worker
    environment:
      <<: [*unomi-base-env, *unomi-consumers-off]
      SPRING_APPLICATION_NAME: unomi-worker-merge
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_NAME: unomi-worker-merge
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_URL: http://worker-merge:8080
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL: http://worker-merge:8080/actuator
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL: http://worker-merge:8080/actuator/health
      SPRING_FLYWAY_ENABLED: "false"
      UNOMI_OUTBOX_PUBLISHER_ENABLED: "false"
      UNOMI_MERGE_CONSUMER_ENABLED: "true"

  worker-segment:
    <<: *unomi-worker
    environment:
      <<: [*unomi-base-env, *unomi-consumers-off]
      SPRING_APPLICATION_NAME: unomi-worker-segment
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_NAME: unomi-worker-segment
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_URL: http://worker-segment:8080
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL: http://worker-segment:8080/actuator
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL: http://worker-segment:8080/actuator/health
      SPRING_FLYWAY_ENABLED: "false"
      UNOMI_OUTBOX_PUBLISHER_ENABLED: "false"
      UNOMI_SEGMENT_CONSUMER_ENABLED: "true"

  worker-rule:
    <<: *unomi-worker
    environment:
      <<: [*unomi-base-env, *unomi-consumers-off]
      SPRING_APPLICATION_NAME: unomi-worker-rule
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_NAME: unomi-worker-rule
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_URL: http://worker-rule:8080
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL: http://worker-rule:8080/actuator
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL: http://worker-rule:8080/actuator/health
      SPRING_FLYWAY_ENABLED: "false"
      UNOMI_OUTBOX_PUBLISHER_ENABLED: "false"
      UNOMI_RULE_CONSUMER_ENABLED: "true"

  worker-action:
    <<: *unomi-worker
    environment:
      <<: [*unomi-base-env, *unomi-consumers-off]
      SPRING_APPLICATION_NAME: unomi-worker-action
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_NAME: unomi-worker-action
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_URL: http://worker-action:8080
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL: http://worker-action:8080/actuator
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL: http://worker-action:8080/actuator/health
      SPRING_FLYWAY_ENABLED: "false"
      UNOMI_OUTBOX_PUBLISHER_ENABLED: "false"
      UNOMI_ACTION_CONSUMER_ENABLED: "true"

  worker-webhook:
    <<: *unomi-worker
    environment:
      <<: [*unomi-base-env, *unomi-consumers-off]
      SPRING_APPLICATION_NAME: unomi-worker-webhook
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_NAME: unomi-worker-webhook
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_URL: http://worker-webhook:8080
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL: http://worker-webhook:8080/actuator
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL: http://worker-webhook:8080/actuator/health
      SPRING_FLYWAY_ENABLED: "false"
      UNOMI_OUTBOX_PUBLISHER_ENABLED: "false"
      UNOMI_WEBHOOK_CONSUMER_ENABLED: "true"

  worker-email:
    <<: *unomi-worker
    environment:
      <<: [*unomi-base-env, *unomi-consumers-off]
      SPRING_APPLICATION_NAME: unomi-worker-email
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_NAME: unomi-worker-email
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_URL: http://worker-email:8080
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_URL: http://worker-email:8080/actuator
      SPRING_BOOT_ADMIN_CLIENT_INSTANCE_HEALTH_URL: http://worker-email:8080/actuator/health
      SPRING_FLYWAY_ENABLED: "false"
      UNOMI_OUTBOX_PUBLISHER_ENABLED: "false"
      UNOMI_EMAIL_CONSUMER_ENABLED: "true"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unomi
      POSTGRES_USER: unomi
      POSTGRES_PASSWORD: unomi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unomi -d unomi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  elasticsearch-data:
  redis-data:
  kafka-data:
