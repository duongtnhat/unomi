replicaCount: 1

image:
  repository: unomi-modern
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: unomi.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

env:
  serverPort: 8080
  datasource:
    url: jdbc:postgresql://postgres:5432/unomi
    username: unomi
    password: unomi
    existingSecret: ""
    usernameKey: username
    passwordKey: password
  elasticsearch:
    uris: http://elasticsearch:9200
  redis:
    host: redis
    port: 6379
  kafka:
    bootstrapServers: kafka:9092
  outbox:
    publisherEnabled: true
    fixedDelayMs: 1000
  consumers:
    writeEsEnabled: true
    mergeEnabled: true
    segmentEnabled: true
    ruleEnabled: true
    actionEnabled: true

extraEnv: []

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

nodeSelector: {}
tolerations: []
affinity: {}
